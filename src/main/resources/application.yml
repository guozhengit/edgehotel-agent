server:
  # 端口规划 2026-10-29：80xx/81xx/82xx/83xx/84xx 已被多项目占用，EdgeHotel 系分配 86xx 段
  # Docker/多商家部署可用环境变量 EH_PORT 覆盖
  port: ${EH_PORT:8600}

spring:
  main:
    banner-mode: "off"

rag:
  embedding:
    # Qwen3-Embedding-0.6B Q8_0（LM Studio 已注册）
    model: ${EH_EMB_MODEL:text-embedding-qwen__qwen3-embedding-0.6b}
    base-url: ${EH_LLM_BASE_URL:http://localhost:1234/v1}

agent:
  # 工具编排模型（M1-1 function calling）
  model: ${EH_AGENT_MODEL:qwen3-30b-a3b}
  base-url: ${EH_LLM_BASE_URL:http://localhost:1234/v1}
  max-tool-rounds: ${EH_MAX_ROUNDS:3}
  # 单轮推理超时（秒）：超时释放推理信号量，不再饿死后续请求（治理：LM Studio 慢/挂起防护）
  chat-timeout-seconds: ${EH_CHAT_TIMEOUT:120}

complaint:
  # 投诉识别模型（M1-2 短文本分类）。2026-10-30 默认切 gemma-4-e4b：
  # Qwen3.5-9B 实测为思考-only 模型（/no_think、thinking 参数、chat_template_kwargs 四机制均无法关闭），
  # 本机同驻 embedding 时分类 101s+ 不可用；gemma 分类实测 10/10 正确、P95=6.2s（F1 大样本重验待做）。
  model: ${EH_COMPLAINT_MODEL:google/gemma-4-e4b}
  base-url: ${EH_LLM_BASE_URL:http://localhost:1234/v1}

app:
  # 行业模板切换（M3 后 Runtime 复用性验证）：hotel（默认）| restaurant
  # 一个模板 = 一套 Tool Bean（条件装配）+ 一份 system prompt（TemplateDescriptor）
  template: ${EH_TEMPLATE:hotel}
  # 启动前置检查（治理 §八）：off | warn（默认）| enforce（内存红线超限拒绝启动）
  preflight: ${EH_PREFLIGHT:warn}
  # 租户标记（M6-1）：落库审计字段（tickets/channel_messages），每商家一个部署实例
  tenant-id: ${EH_TENANT_ID:default}
  # HarnessAgent 工作区（相对路径容器/宿主通用；Docker 卷可挂载持久化）
  workspace: ${EH_WORKSPACE:.agentscope/workspace}
  # 运行时守卫（每 5 分钟复检内存/引擎数/模型加载态，漂移告警）：on（默认）| off
  runtime-guard: ${EH_RUNTIME_GUARD:on}
  # MCP 数据源模式：true 时读类工具桥接 edgehotel-mcp-server（EH_MCP_URL 指向 8601 /mcp），
  # 数据源（demo/外置JSON/aurora 真实PMS）由 MCP server 侧决定；写类工具仍走运行时（审批+落库）
  mcp:
    enabled: ${EH_MCP_ENABLED:false}
    base-url: ${EH_MCP_URL:http://localhost:8601/mcp}
    sensitive-tools: "${EH_MCP_SENSITIVE:}"

channel:
  # 私域渠道接入（M4）：通用 Webhook 入口 POST /api/channel/webhook
  # enabled=true 必须配 secret（echo 本地联调除外）；echo=true 为回环测试模式（不调模型）
  enabled: ${EH_CHANNEL_ENABLED:false}
  secret: ${EH_CHANNEL_SECRET:}
  echo: ${EH_CHANNEL_ECHO:false}
  # 频控（M6-2）：per-peer 每分钟消息上限（防滥用）；0=关闭
  rate-limit-per-minute: ${EH_CHANNEL_RATE_LIMIT:30}
  dingtalk:
    # 钉钉机器人回调 POST /api/channel/dingtalk/callback（签名复用官方 DingTalkCallbackCrypto；恒 200 语义）
    enabled: ${EH_DINGTALK_ENABLED:false}
    app-secret: ${EH_DINGTALK_APP_SECRET:}   # HMAC-SHA256 签名密钥
    aes-key: ${EH_DINGTALK_AES_KEY:}         # 可选：加密信封解密
  wecom:
    # 企业微信回调 POST|GET /api/channel/wecom/callback（加解密复用官方 WeComCrypto，XML 信封）
    enabled: ${EH_WECOM_ENABLED:false}
    token: ${EH_WECOM_TOKEN:}
    encoding-aes-key: ${EH_WECOM_ENCODING_AES_KEY:}
    receive-id: ${EH_WECOM_RECEIVE_ID:}   # 即 CorpID
    corp-id: ${EH_WECOM_CORP_ID:}         # 出站（IM API 回复）需要；缺省 pending_credentials
    corp-secret: ${EH_WECOM_CORP_SECRET:}
  feishu:
    # 飞书事件订阅回调 POST /api/channel/feishu/callback（加解密复用官方 FeishuCrypto）
    enabled: ${EH_FEISHU_ENABLED:false}
    encrypt-key: ${EH_FEISHU_ENCRYPT_KEY:}
    verification-token: ${EH_FEISHU_VERIFICATION_TOKEN:}
    app-id: ${EH_FEISHU_APP_ID:}        # 出站（IM API 回复）需要；缺省时回复状态=pending_credentials
    app-secret: ${EH_FEISHU_APP_SECRET:}
  # SQLite 库路径（每商家独立库 = 租户隔离；Docker 挂载卷到 data/）
  db-path: ${EH_DB_PATH:data/edgehotel.db}

agentscope:
  model:
    provider: openai
  openai:
    enabled: true
    # LM Studio 不校验 API Key，占位即可
    api-key: "lm-studio"
    # LM Studio 已装模型（骨干）；快路径可切换 qwen/qwen3.5-9b
    model-name: ${EH_AGENT_MODEL:qwen3-30b-a3b}
    # LM Studio OpenAI 兼容端点
    base-url: ${EH_LLM_BASE_URL:http://localhost:1234/v1}
    stream: true
  agent:
    # 关闭 core starter 的自动 ReActAgent/Memory/Toolkit（本工程用自定义 HarnessAgent）
    enabled: false

logging:
  level:
    io.agentscope: INFO
